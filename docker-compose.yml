services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: subkeeper
      POSTGRES_USER: subkeeper
      POSTGRES_PASSWORD: subkeeper
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subkeeper -d subkeeper"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://subkeeper:subkeeper@db:5432/subkeeper?schema=public
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install && npx prisma generate && npx prisma db push && npm run dev"

volumes:
  pgdata:
