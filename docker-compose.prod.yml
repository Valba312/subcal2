version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: subkeeper
      POSTGRES_USER: subkeeper
      POSTGRES_PASSWORD: subkeeper
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subkeeper -d subkeeper"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "10000:10000"
    environment:
      - NODE_ENV=production
      - HOME=/tmp
      - NPM_CONFIG_CACHE=/tmp/.npm
      - DATABASE_URL=postgresql://subkeeper:subkeeper@db:5432/subkeeper?schema=public
      - PORT=10000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
