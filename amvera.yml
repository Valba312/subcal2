name: subkeeper

# Build using the repository Dockerfile to ensure Node 22 and our image configuration
build:
  type: docker
  dockerfile: Dockerfile

run:
  # Command to run the app inside the built image
  command: sh -c "node scripts/ensure-sqlite-schema.mjs && sh ./scripts/start.sh"
  env:
    HOME: /tmp
    NPM_CONFIG_CACHE: /tmp/.npm
    PORT: "10000"
    AUTOBUILD: "false"
  ports:
    - "10000:10000"

resources:
  # Increase if you see OOM/503; set to 1G for debugging
  memory: 1G
  cpu: 0.5
