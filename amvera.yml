meta:
  environment: node
  toolchain:
    name: node
    tool: nodejs
    version: "22"
    packageManager: npm

build:
  skip: false
  command: "npm ci && npm run build"
  additionalCommands: ""
  artifacts:
    - key: .
      value: /

run:
  command: "npm run start"
  scriptName: ""
  scriptArguments: ""
  nodeArguments: ""
  persistenceMount: /data
  containerPort: 3000
  env:
    DATABASE_URL: "file:/data/prisma/dev.db"
    NODE_ENV: production

notes: |
  - This configuration includes an empty `meta.toolchain` section to match the
    platform example. The platform UI may override toolchain details.
  - Recommended build command: `npm ci && npm run build`.
  - Ensure a persistent volume is mounted to `/data` and that `DATABASE_URL`
    points to `file:/data/prisma/dev.db` for production.
